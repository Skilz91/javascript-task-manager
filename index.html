<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>
        <p class="subtitle">Demonstrating JS DOM Manipulation & LocalStorage</p>
        
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Add a new task..." required autocomplete="off">
            <button type="submit">Add Task</button>
        </form>

        <ul id="task-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
